<div class="login-page">
    <div class="login-card">

        <h1>Admin Login</h1>

        <form (ngSubmit)="login()">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    [(ngModel)]="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    required
                >
            </div>

            <button type="submit">
                Log In
            </button>

        </form>

        @if (error) {
            <p class="login-error">{{ error }}</p>
        }

    </div>
</div>
